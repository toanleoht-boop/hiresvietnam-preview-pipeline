name: Build audio previews

on:
  workflow_dispatch:
    inputs:
      job_file:
        description: "Đường dẫn job JSON, ví dụ preview-jobs/giao-huong-dam-cuoi.json"
        required: true
        default: "preview-jobs/giao-huong-dam-cuoi.json"

permissions:
  contents: read

concurrency:
  group: audio-preview-${{ inputs.job_file }}
  cancel-in-progress: false

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Drive downloader and uploader
        run: |
          python -m pip install --disable-pip-version-check gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg lftp

      - name: Build MP3 previews
        run: node scripts/build-audio-previews.mjs --job "${{ inputs.job_file }}" --output preview-dist

      - name: Read album slug
        run: echo "ALBUM_SLUG=$(jq -r '.albumSlug' '${{ inputs.job_file }}')" >> "$GITHUB_ENV"

      - name: Keep generated files for download
        uses: actions/upload-artifact@v4
        with:
          name: audio-previews-${{ env.ALBUM_SLUG }}
          path: preview-dist/
          retention-days: 3

      - name: Publish previews to cPanel over HTTPS API
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_API_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_API_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          test -n "$CPANEL_HOST" && test -n "$CPANEL_USER" && test -n "$CPANEL_TOKEN"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            "https://$CPANEL_HOST:2083/json-api/cpanel?cpanel_jsonapi_user=$CPANEL_USER&cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=mkdir&path=hiresvietnam.site%2Fpreviews&name=$ALBUM_SLUG" || true
          for file in preview-dist/$ALBUM_SLUG/*; do
            echo "Uploading $(basename "$file")"
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
              -F "dir=hiresvietnam.site/previews/$ALBUM_SLUG" \
              -F "file-1=@$file" \
              "https://$CPANEL_HOST:2083/execute/Fileman/upload_files")
            echo "$response" | jq -e '.result.status == 1' >/dev/null
          done
