name: Build audio previews

on:
  workflow_dispatch:
    inputs:
      job_file:
        description: "Preview job JSON path"
        required: true
        default: "preview-jobs/giao-huong-dam-cuoi.json"

permissions:
  contents: write

concurrency:
  group: audio-preview-${{ inputs.job_file }}
  cancel-in-progress: false

jobs:
  convert-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Drive downloader and uploader
        run: |
          python -m pip install --disable-pip-version-check gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg lftp

      - name: Build MP3 previews
        run: node scripts/build-audio-previews.mjs --job "${{ inputs.job_file }}" --output preview-dist

      - name: Read album slug
        run: echo "ALBUM_SLUG=$(jq -r '.albumSlug' '${{ inputs.job_file }}')" >> "$GITHUB_ENV"

      - name: Keep generated files for download
        uses: actions/upload-artifact@v4
        with:
          name: audio-previews-${{ env.ALBUM_SLUG }}
          path: preview-dist/
          retention-days: 3

      - name: Publish previews to GitHub Pages
        run: |
          cp -R preview-dist /tmp/preview-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          mkdir -p "previews/$ALBUM_SLUG"
          cp -R "/tmp/preview-dist/$ALBUM_SLUG/." "previews/$ALBUM_SLUG/"
          touch .nojekyll
          git add .nojekyll "previews/$ALBUM_SLUG"
          git commit -m "Publish previews for $ALBUM_SLUG"
          git push --force origin gh-pages
